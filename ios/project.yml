# XcodeGen spec. On the Mac: `brew install xcodegen`, then `xcodegen` in this
# folder creates ScienceChatbot.xcodeproj (generated, not committed).
name: ScienceChatbot
options:
  bundleIdPrefix: local.sciencechatbot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  ScienceCore:
    path: ScienceCore
  LlamaFramework:
    path: LlamaFramework

targets:
  ScienceChatbot:
    type: application
    platform: iOS
    sources:
      - ScienceChatbot
      # Same prompt and question bank as the Rust server, referenced in place.
      - path: ../backend/src/tutor.txt
        buildPhase: resources
      - path: ../backend/data/questions.json
        buildPhase: resources
    dependencies:
      - package: ScienceCore
      - package: LlamaFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sciencechatbot.app
        PRODUCT_NAME: Science Chatbot
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
        CODE_SIGN_STYLE: Automatic
        # Set your Apple ID team in Xcode (Signing & Capabilities); not committed.
        DEVELOPMENT_TEAM: ""
    info:
      path: ScienceChatbot/Info.plist
      properties:
        CFBundleDisplayName: Science Chatbot
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
