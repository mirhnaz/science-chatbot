<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Curio trail complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#FFF9F0}
a{color:#4F46C9;text-decoration:none}a:hover{color:#3B34A6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 16px 20px; display: flex; flex-direction: column; background: #FFF9F0; color: #211E3B; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1.5px solid #EDE6DA; display: flex; align-items: center; justify-content: center; color: #5B5775; box-sizing: border-box;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </a>
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6785;">Comets · 4 steps</div>
    <div style="width: 44px; height: 44px;"></div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; margin-top: 26px;">
    <div style="width: 156px; height: 156px; border-radius: 78px; background: #E6E1FF; border: 5px solid {{accent}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
      <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#4F46C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="8" r="4" fill="#FFFFFF"></circle><path d="M13 11L3 21"></path><path d="M11 8L4 15"></path><path d="M16 13l-7 7"></path></svg>
    </div>
    <h1 style="margin: 20px 0 0 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 30px; line-height: 34px; font-weight: 700; text-align: center;">Trail complete!</h1>
    <p style="margin: 8px 0 0 0; font-size: 16px; line-height: 23px; font-weight: 600; color: #5B5775; text-align: center; max-width: 300px;">You earned the Comet stamp. Here's what you figured out:</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #EDE6DA;">
    <div style="display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 21px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F7A45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M5 12l5 5L20 7"></path></svg>
      <span>A comet is a frozen ball of ice, dust and rock.</span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 21px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F7A45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M5 12l5 5L20 7"></path></svg>
      <span>Sunlight turns its ice into gas, and that becomes the tail.</span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 21px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F7A45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M5 12l5 5L20 7"></path></svg>
      <span>The tail always points away from the Sun.</span>
    </div>
  </div>

  <div style="margin-top: 22px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 17px; font-weight: 600;">Your stamps</div>
    <div style="font-size: 13px; font-weight: 800; color: #6B6785;">3 of 12</div>
  </div>
  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <div aria-label="Weather stamp, earned" style="width: 56px; height: 56px; border-radius: 28px; background: #DCEBFB; display: flex; align-items: center; justify-content: center; color: #1D5FA8;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M9 1.5V3"></path><path d="M2.5 8H4"></path><path d="M4.4 3.4l1 1"></path><path d="M8 20.5h9a3.5 3.5 0 0 0 .5-7 5 5 0 0 0-9.6 1.5A3 3 0 0 0 8 20.5z"></path></svg>
    </div>
    <div aria-label="Animals stamp, earned" style="width: 56px; height: 56px; border-radius: 28px; background: #DBF3E3; display: flex; align-items: center; justify-content: center; color: #1F7A45;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 8.5 6 8.5 6-2.5 6-8.5 6-9.5-6-9.5-6z"></path><path d="M20.5 12l1.5-3.5v7z" fill="currentColor"></path><circle cx="8" cy="11" r="1.2" fill="currentColor"></circle></svg>
    </div>
    <div aria-label="Comet stamp, just earned" style="width: 56px; height: 56px; border-radius: 28px; background: {{accent}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="8" r="4"></circle><path d="M13 11L3 21"></path><path d="M11 8L4 15"></path><path d="M16 13l-7 7"></path></svg>
    </div>
    <div aria-label="Locked stamp" style="width: 56px; height: 56px; border-radius: 28px; border: 2px dashed #D6CFC2; box-sizing: border-box;"></div>
    <div aria-label="Locked stamp" style="width: 56px; height: 56px; border-radius: 28px; border: 2px dashed #D6CFC2; box-sizing: border-box;"></div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 26px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800;">Start a new spark</a>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 26px; background: #FFFFFF; border: 1.5px solid #EDE6DA; color: #4F46C9; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg>
      Show a grown-up
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F46C9","options":["#4F46C9","#1D5FA8","#1F7A45","#B8452E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#4F46C9' };
  }
}
</script>
</body>
</html>
